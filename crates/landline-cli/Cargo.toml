[package]
name = "landline-cli"
description = "Headless driver for landline-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "landline"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
landline-core.workspace = true
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
