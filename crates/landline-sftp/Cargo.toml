[package]
name = "landline-sftp"
description = "SFTP client for browsing a phone's storage through KDE Connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
der = "0.8.3"
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
spki = "0.8.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "time", "sync", "rt", "macros"] }
tracing = "0.1.44"
