name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the app
        run: ./scripts/build-app.sh --release --universal
      - name: Test the bridge
        run: ./scripts/test-swift.sh
      - name: Check the app bundle
        run: |
          app=build/Landline.app
          test "$(lipo -archs "$app/Contents/MacOS/Landline")" = "x86_64 arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          codesign --verify --strict "$app"
